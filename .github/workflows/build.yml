name: Build and Test

on:
  push:
  pull_request:

# Versions are pinned on purpose; the one place that records them is
# lamsza/docs/network/VERSIONS.md.
# - runs-on: ubuntu-24.04 is the OS of the production droplet (Ubuntu 24.04 LTS).
#   Do not change it back to ubuntu-latest: that moves to a new Ubuntu on
#   GitHub's schedule, not ours, and CI would stop matching production.
# - Node comes from .nvmrc and Go from backend/go.mod. No version is written in
#   this file, so the two can never disagree with the repo.
# When the droplet is upgraded (Ubuntu, Node or Go), update the runs-on pin,
# .nvmrc, go.mod and VERSIONS.md together, in the same change.
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # The receiver below has no other gate, and it is the one script whose
      # failure is self-concealing: if ci-status-issue.sh breaks, the only symptom
      # is the ci-status job going red on `main`, and the thing that reports a red
      # `main` is that same script. So it is tested inside a job somebody watches.
      # It lives in `frontend` rather than `backend` to keep the step identical
      # across the four repos; `working-directory` because this job otherwise runs
      # from frontend/ and the test is at the repo root. Hermetic: fakes `gh`, no
      # network, needs only jq, which is on the runner image.
      - name: Test the CI status receiver
        working-directory: .
        run: bash .github/ci-status-issue.test.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Tests before the build: a failing assertion is a faster, clearer signal
      # than whatever the build does with the same broken code.
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -count=1 ./...
      - run: go build -o /tmp/lamsza-admin .

  # The receiver. A red CI is only a gate if it reaches a person, and nothing on
  # the dev machine can fully read Actions: no `gh` CLI, git auth is SSH-key only,
  # and two of the four repos are private (the two public ones can be read
  # unauthenticated; see R7). So the signal is pushed from in here, into one GitHub issue
  # that closes itself when main goes green. Decided on BOG-54; see R7 in lamsza's
  # docs/network/WAYS_OF_WORKING.md.
  #
  # Pushes to `main` only: a pull request shows its own checks, and a feature
  # branch being red mid-work is normal and must not notify anyone. `always()` so
  # it still runs after a failed job, and the third clause keeps a cancelled or
  # skipped run from being reported as a failure.
  ci-status:
    needs: [frontend, backend]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && (needs.frontend.result == 'failure' || needs.backend.result == 'failure'
      || (needs.frontend.result == 'success' && needs.backend.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Open, update or close the "CI is red on main" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_FRONTEND: ${{ needs.frontend.result }}
          CI_BACKEND: ${{ needs.backend.result }}
          CI_SHA: ${{ github.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/ci-status-issue.sh
